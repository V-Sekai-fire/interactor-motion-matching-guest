name: guest

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: mm_core on the clip set, and the planted k-d control
        run: |
          g++ -std=c++20 -O2 -ffp-contract=off -Wall -Wextra -Isrc tests/mm_core_test.cpp -o mm_core_test
          ./mm_core_test data/kimodo-locomotion:data/o3de-motionmatching
          if ./mm_core_test data/kimodo-locomotion:data/o3de-motionmatching --plant-kd; then
            echo "the planted k-d bug passed: the check cannot fail" >&2
            exit 1
          fi
          if ./mm_core_test data/kimodo-locomotion:data/o3de-motionmatching --plant-phase; then
            echo "joins out of phase passed: the check cannot fail" >&2
            exit 1
          fi
          if ./mm_core_test data/kimodo-locomotion:data/o3de-motionmatching --plant-rate; then
            echo "clips read at the wrong frame rate passed: the check cannot fail" >&2
            exit 1
          fi
      - name: The steady gaits' loop seams, and the uncut control
        run: |
          g++ -std=c++20 -O2 -ffp-contract=off -Wall -Wextra -Isrc tools/make_loops.cpp -o make_loops
          ./make_loops data/kimodo-locomotion data/kimodo-locomotion/loops.txt --check
          if ./make_loops data/kimodo-locomotion data/kimodo-locomotion/loops.txt --uncut; then
            echo "uncut clips passed the seam gate: the check cannot fail" >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: weft/3-interactor/motion-matching-guest
      - name: Tools from apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld cmake ninja-build
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: The goal manifest's sibling checkouts
        working-directory: weft
        run: |
          for p in 2-contract/guest-runtime:contract-guest-runtime 5-repository/riscv64-sysroot:repository-riscv64-sysroot; do
            git clone -q --depth 1 "https://github.com/V-Sekai-fire/${p#*:}" "${p%%:*}"
          done
      - name: mm.elf from a clean runner
        working-directory: weft/3-interactor/motion-matching-guest
        run: elixir tools/build.exs --build="$RUNNER_TEMP/rv64"
      - uses: actions/upload-artifact@v4
        with:
          name: mm-elf-${{ github.sha }}
          path: ${{ runner.temp }}/rv64/mm.elf
